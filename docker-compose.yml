name: medigrid

x-app: &app
  build: .
  image: medigrid-app:local
  env_file: .env
  environment: &app-env
    PG_HOST: postgres
    REDIS_HOST: redis
    MQ_HOST: rabbitmq
    MQ_MGMT_URL: http://rabbitmq:15672
    API_INTERNAL_URLS: http://api-1:8000,http://api-2:8000
    NGINX_URL: http://nginx:8080

x-api-health: &api-health
  test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz',timeout=2)"]
  interval: 3s
  timeout: 3s
  retries: 20

services:
  postgres:
    image: postgres:16.6
    env_file: .env
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.1
    command: ["redis-server", "--save", "", "--appendonly", "no", "--notify-keyspace-events", "Ex"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.0.5-management
    hostname: rabbitmq
    env_file: .env
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["mqdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  migrate:
    <<: *app
    environment:
      <<: *app-env
      ROLE: migrate
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  seed:
    <<: *app
    environment:
      <<: *app-env
      ROLE: seed
    restart: "no"
    depends_on:
      migrate: {condition: service_completed_successfully}

  api-1:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
      INSTANCE: api-1
    ports: ["127.0.0.1:8001:8000"]
    restart: unless-stopped
    healthcheck: *api-health
    depends_on: &api-deps
      seed: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  api-2:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
      INSTANCE: api-2
    ports: ["127.0.0.1:8002:8000"]
    restart: unless-stopped
    healthcheck: *api-health
    depends_on: *api-deps

  worker-1:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
      INSTANCE: worker-1
    restart: unless-stopped
    depends_on: *api-deps

  worker-2:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
      INSTANCE: worker-2
    restart: unless-stopped
    depends_on: *api-deps

  nginx:
    image: nginx:1.27.3-alpine
    ports: ["0.0.0.0:8080:8080"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    restart: unless-stopped
    depends_on:
      api-1: {condition: service_healthy}
      api-2: {condition: service_healthy}

  tools:
    <<: *app
    environment:
      <<: *app-env
      ROLE: tools
      INSTANCE: tools
    profiles: ["tools"]
    restart: "no"
    command: ["python", "-c", "print('use: docker compose run --rm tools python -m sim.<name>')"]
    volumes: ["./results:/srv/results"]

volumes:
  pgdata:
  mqdata:
