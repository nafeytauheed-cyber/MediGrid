<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="1100" height="720" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b3a"/></marker>
  </defs>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#1b1f24">MediGrid: request, message and update paths</text>

  <!-- boxes -->
  <g fill="#f4f5f7" stroke="#555d66">
    <rect x="20" y="70" width="150" height="70" rx="3"/>
    <rect x="220" y="70" width="140" height="70" rx="3"/>
    <rect x="410" y="60" width="200" height="60" rx="3"/>
    <rect x="410" y="140" width="200" height="60" rx="3"/>
    <rect x="690" y="50" width="250" height="110" rx="3"/>
    <rect x="690" y="230" width="250" height="150" rx="3"/>
    <rect x="410" y="300" width="200" height="110" rx="3"/>
    <rect x="80" y="470" width="900" height="200" rx="3"/>
  </g>
  <g fill="#1b1f24">
    <text x="32" y="98" font-weight="700">Browsers</text><text x="32" y="116">control, dispatch,</text><text x="32" y="132">hospital, ops</text>
    <text x="232" y="98" font-weight="700">nginx :8080</text><text x="232" y="116">round robin,</text><text x="232" y="132">next upstream on fail</text>
    <text x="422" y="84" font-weight="700">api-1 (Flask, gunicorn)</text><text x="422" y="102">SmartMatch, reserve, SSE hub</text>
    <text x="422" y="164" font-weight="700">api-2 (same image)</text><text x="422" y="182">stateless, any user</text>
    <text x="702" y="74" font-weight="700">Redis 7 (no persistence)</text>
    <text x="702" y="92">mg:&lt;gen&gt;:hospitals:geo, free sets</text>
    <text x="702" y="110">Lua provisional hold + rate limit</text>
    <text x="702" y="128">fencing pointer = READY generation</text>
    <text x="702" y="146">pub/sub medigrid:ui:delta</text>
    <text x="702" y="254" font-weight="700">PostgreSQL 16 (final arbiter)</text>
    <text x="702" y="272">beds: conditional UPDATE ... FREE</text>
    <text x="702" y="290">reservations: unique HELD/CONFIRMED</text>
    <text x="702" y="308">outbox_events (same transaction)</text>
    <text x="702" y="326">inbox, per-group patient cursors</text>
    <text x="702" y="344">system_state: cache state, generation</text>
    <text x="702" y="362">reaper scan = expiry authority</text>
    <text x="422" y="324" font-weight="700">worker-1, worker-2</text>
    <text x="422" y="342">outbox publisher (confirms)</text>
    <text x="422" y="360">reaper, cache manager (rebuild)</text>
    <text x="422" y="378">4 consumer threads each</text>
    <text x="422" y="396">retry 1/3/9 s, DLQ handoff</text>
    <text x="92" y="494" font-weight="700">RabbitMQ 4.0 (durable topic exchange medigrid.events, persistent messages, x-max-priority 4)</text>
  </g>
  <g fill="#ffffff" stroke="#555d66">
    <rect x="100" y="510" width="200" height="140" rx="3"/>
    <rect x="320" y="510" width="200" height="140" rx="3"/>
    <rect x="540" y="510" width="200" height="140" rx="3"/>
    <rect x="760" y="510" width="200" height="140" rx="3"/>
  </g>
  <g fill="#1b1f24" font-size="12">
    <text x="110" y="530" font-weight="700">q.bed_tracking</text><text x="110" y="547">bed.#, transfer.#</text><text x="110" y="564">prefetch 1</text><text x="110" y="590">.retry.1s/3s/9s</text><text x="110" y="607">.dlq</text><text x="110" y="630">effect: occupancy +</text><text x="110" y="645">Redis reconcile</text>
    <text x="330" y="530" font-weight="700">q.transfer_saga</text><text x="330" y="547">transfer.#, bed.#</text><text x="330" y="564">prefetch 1</text><text x="330" y="590">.retry.1s/3s/9s</text><text x="330" y="607">.dlq</text><text x="330" y="630">effect: saga log,</text><text x="330" y="645">hold-expiry timeout</text>
    <text x="550" y="530" font-weight="700">q.notifications</text><text x="550" y="547"># (all events)</text><text x="550" y="564">prefetch 5</text><text x="550" y="590">.retry.1s/3s/9s</text><text x="550" y="607">.dlq</text><text x="550" y="630">effect: in-app notice,</text><text x="550" y="645">publish UI delta</text>
    <text x="770" y="530" font-weight="700">q.audit</text><text x="770" y="547"># (all events)</text><text x="770" y="564">prefetch 20</text><text x="770" y="590">.retry.1s/3s/9s</text><text x="770" y="607">.dlq</text><text x="770" y="630">effect: audit log,</text><text x="770" y="645">events per second</text>
  </g>

  <!-- 1. request path: solid blue -->
  <g stroke="#1f3a5f" stroke-width="2.5" fill="none">
    <path d="M170 105 H218" marker-end="url(#a1)"/>
    <path d="M360 95 H408" marker-end="url(#a1)"/>
    <path d="M360 120 L408 165" marker-end="url(#a1)"/>
    <path d="M610 85 H688" marker-end="url(#a1)"/>
    <path d="M610 175 L688 270" marker-end="url(#a1)"/>
  </g>
  <g fill="#1f3a5f" font-size="12">
    <text x="618" y="78">1a GEOSEARCH + Lua</text>
    <text x="604" y="236">1b one transaction:</text><text x="604" y="250">bed + reservation + outbox</text>
  </g>

  <!-- 2. message path: dashed amber -->
  <g stroke="#8a5a00" stroke-width="2.5" fill="none" stroke-dasharray="8 5">
    <path d="M688 330 H612" marker-end="url(#a2)"/>
    <path d="M470 410 V468" marker-end="url(#a2)"/>
    <path d="M560 468 V412" marker-end="url(#a2)"/>
    <path d="M612 395 L688 372" marker-end="url(#a2)"/>
  </g>
  <g fill="#8a5a00" font-size="12">
    <text x="616" y="324">2a sweep PENDING</text>
    <text x="380" y="450">2b confirmed publish</text>
    <text x="566" y="450">2c deliver, ack after commit</text>
    <text x="618" y="410">2d inbox + effect</text>
  </g>

  <!-- 3. update path: dotted green -->
  <g stroke="#2f6b3a" stroke-width="2.5" fill="none" stroke-dasharray="2 5">
    <path d="M640 508 C 660 300, 980 300, 942 150" marker-end="url(#a3)"/>
    <path d="M688 140 L612 115" marker-end="url(#a3)"/>
    <path d="M408 110 C 300 200, 140 200, 95 142" marker-end="url(#a3)"/>
  </g>
  <g fill="#2f6b3a" font-size="12">
    <text x="950" y="230">3a PUBLISH delta</text>
    <text x="614" y="134">3b subscribe</text>
    <text x="150" y="215">3c SSE batch every 100 ms</text>
    <text x="150" y="231">(+ PostgreSQL watermark poll)</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#1b1f24">
    <line x1="20" y1="690" x2="60" y2="690" stroke="#1f3a5f" stroke-width="2.5"/><text x="66" y="694">1 request path (solid)</text>
    <line x1="230" y1="690" x2="270" y2="690" stroke="#8a5a00" stroke-width="2.5" stroke-dasharray="8 5"/><text x="276" y="694">2 message path (dashed)</text>
    <line x1="460" y1="690" x2="500" y2="690" stroke="#2f6b3a" stroke-width="2.5" stroke-dasharray="2 5"/><text x="506" y="694">3 update path (dotted)</text>
    <text x="700" y="694">Redis outage: API uses PostgreSQL only until a fenced rebuild sets READY.</text>
  </g>
</svg>
