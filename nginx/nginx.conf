worker_processes 1;
events { worker_connections 4096; }

http {
    access_log off;
    sendfile on;

    # Docker DNS, re-resolved every 2 s: recreated or restarted API containers get new IPs (BUILD_LOG 502 entry).
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream medigrid_api {
        zone medigrid_api 64k;
        server api-1:8000 max_fails=1 fail_timeout=2s resolve;
        server api-2:8000 max_fails=1 fail_timeout=2s resolve;
        keepalive 32;
        keepalive_timeout 50s;  # shorter than gunicorn keepalive (75 s): the proxy closes idle upstream connections first
    }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        location /api/stream {
            proxy_pass http://medigrid_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        location / {
            proxy_pass http://medigrid_api;
        }
    }
}
